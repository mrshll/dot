# Deskflow screen layout, read by the server on the Mac.
# marshbox sits to the right of the MacBook. To move it, change both links
# below (right/left, or up/down) and restart Deskflow.
section: screens
	macbook:
	marshbox:
end

section: links
	macbook:
		right = marshbox
	marshbox:
		left = macbook
end
