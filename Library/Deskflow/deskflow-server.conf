# Deskflow screen layout, read by the server on the Mac.
# marshbox sits to the right of marshtop (the Mac). To move it, change both links
# below (right/left, or up/down) and restart Deskflow.
section: screens
	marshtop:
	marshbox:
end

section: links
	marshtop:
		right = marshbox
	marshbox:
		left = marshtop
end
