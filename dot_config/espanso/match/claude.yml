# yaml-language-server: $schema=https://raw.githubusercontent.com/espanso/espanso/dev/schemas/match.schema.json

# Prompts typed into Claude Code. Each hands the review of the current PR to a
# second agent in a background herdr tab, then works its findings back into the
# PR from here.
#
# NOTE: espanso fires a trigger the instant its exact characters are typed, with
# no lookahead — so no trigger here may be a prefix of another. `:revcl` and
# `:revco` share a prefix but neither contains the other, so both are safe.

matches:
  # Review by Claude. The bare PR number targets the PR rather than the working
  # tree; --comment posts findings as inline PR comments.
  - trigger: ":revcl"
    replace: >-
      open a background herdr tab and have claude review the current PR:
      `/code-review <pr#> --comment`. Pass it this guidance: review only —
      report findings as comments and leave the fixes to me, since I'm
      applying them from here. Take its findings, determine which are
      actionable, and address them in the PR. Reply to its comments with the
      resolution or why no action was taken. When the review is complete,
      close the background herdr tab.

  # Same, by Codex — its /review has no comment flag, so ask for PR comments.
  - trigger: ":revco"
    replace: >-
      open a background herdr tab and have codex review the current PR:
      `/review`, putting its findings as PR comments. Pass it this guidance:
      review only — report findings as comments and leave the fixes to me,
      since I'm applying them from here. Take its findings, determine which
      are actionable, and address them in the PR. Reply to its comments with
      the resolution or why no action was taken. When the review is complete,
      close the background herdr tab.
