# AeroSpace — the OS layer of the keyboard ladder.
#
# One ladder, one meaning per key, at every depth:
#
#   depth              modifier   hjkl              1..9
#   ---------------------------------------------------------------
#   OS windows         alt        focus window      switch workspace
#   OS windows (move)  alt+shift  move window       send to workspace
#   herdr panes/tabs   ctrl+alt   focus pane        switch workspace
#   tmux               prefix     focus pane        switch window
#
# alt is $mod because that is what i3 uses and because a single-modifier
# reach is the entire point. AeroSpace grabs these globally, which means
# alt+hjkl and alt+1..9 never reach a terminal and never emit the macOS
# dead-key characters (˙∆˚¬, ¡™£) they otherwise would.
#
# What that costs inside readline REPLs (python, psql, bash — fish is
# unaffected for word motion, which lives on alt+arrow there):
#   alt+l    was downcase-word
#   alt+1..9 was digit-argument
#   alt+/    was complete-filename
#   alt+f    was forward-word   <- given up to keep i3's mod+f (fullscreen).
#                                  backward-word on alt+b still works, so
#                                  word motion is one-sided in readline;
#                                  alt+arrow is the way back.
#   alt+r    was revert-line    <- given up to keep i3's mod+r (resize mode).
#                                  Rarely used, and ctrl+_ undoes a line edit.
# Deliberately NOT bound, so they keep working: alt+b (backward-word),
# alt+d (kill-word), alt+t (transpose-word), alt+. (yank-last-arg).
# The ladder now matches i3 on every binding it shares with it.
#
# alt+space is intentionally absent: Raycast owns it, which is exactly
# i3's $mod+d launcher slot. espanso's search bar is disabled to match
# (see dot_config/espanso/config/default.yml).

# Mandatory. Omitting this key falls back to config-version = 1, which does not
# parse this file. See nikitabobko.github.io/AeroSpace/guide#config-version
config-version = 2

after-login-command = []
after-startup-command = []
start-at-login = true

enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

accordion-padding = 30
default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'

# Follow focus across monitors so the pointer lands where the keyboard went.
on-focused-monitor-changed = ['move-mouse monitor-lazy-center']

automatically-unhide-macos-hidden-apps = false

[key-mapping]
preset = 'qwerty'

# Matches kitty's window_margin_width 4, so a tiled kitty and a tiled
# anything-else line up on the same grid.
[gaps]
inner.horizontal = 4
inner.vertical = 4
outer.left = 4
outer.bottom = 4
outer.top = 4
outer.right = 4

[mode.main.binding]

# --- launch -----------------------------------------------------------------
# i3's $mod+Return. -n forces a new kitty window rather than raising the
# existing one.
alt-enter = 'exec-and-forget open -na kitty'

# --- focus (i3 $mod+hjkl) ---------------------------------------------------
alt-h = 'focus left'
alt-j = 'focus down'
alt-k = 'focus up'
alt-l = 'focus right'

# --- move (i3 $mod+Shift+hjkl) ----------------------------------------------
alt-shift-h = 'move left'
alt-shift-j = 'move down'
alt-shift-k = 'move up'
alt-shift-l = 'move right'

# --- workspaces (i3 $mod+1..9) ----------------------------------------------
alt-1 = 'workspace 1'
alt-2 = 'workspace 2'
alt-3 = 'workspace 3'
alt-4 = 'workspace 4'
alt-5 = 'workspace 5'
alt-6 = 'workspace 6'
alt-7 = 'workspace 7'
alt-8 = 'workspace 8'
alt-9 = 'workspace 9'
alt-0 = 'workspace 10'

# --- send to workspace (i3 $mod+Shift+1..9) ---------------------------------
alt-shift-1 = 'move-node-to-workspace 1'
alt-shift-2 = 'move-node-to-workspace 2'
alt-shift-3 = 'move-node-to-workspace 3'
alt-shift-4 = 'move-node-to-workspace 4'
alt-shift-5 = 'move-node-to-workspace 5'
alt-shift-6 = 'move-node-to-workspace 6'
alt-shift-7 = 'move-node-to-workspace 7'
alt-shift-8 = 'move-node-to-workspace 8'
alt-shift-9 = 'move-node-to-workspace 9'
alt-shift-0 = 'move-node-to-workspace 10'

# --- layout -----------------------------------------------------------------
alt-tab = 'workspace-back-and-forth'
alt-f = 'fullscreen'
# i3's `layout toggle all` has no direct analogue. AeroSpace has no tabbed or
# stacking layout, and `layout` is a two-state toggle rather than a cycle --
# arguments past the first two are ignored (verified: `layout h_tiles v_tiles
# h_accordion v_accordion` only ever flips h_tiles <-> v_tiles).
#
# So the four states are reached with two orthogonal toggles instead, which
# needs at most two keystrokes rather than i3's up-to-three cycling:
#
#   family \ orientation    horizontal      vertical
#   tiles                   h_tiles         v_tiles        i3 splith / splitv
#   accordion               h_accordion     v_accordion    i3 tabbed / stacking
#
# accordion is the stacking/tabbed analogue -- unfocused windows collapse to
# slivers sized by accordion-padding above.
#
# This replaces the shipped defaults, whose alt-comma
# ('layout accordion horizontal vertical') just toggled orientation again and
# so duplicated alt-slash.
alt-slash = 'layout horizontal vertical'
alt-comma = 'layout tiles accordion'
alt-shift-space = 'layout floating tiling'
alt-shift-q = 'close'
alt-shift-c = 'reload-config'

# --- resize mode (i3 $mod+r) ------------------------------------------------
alt-r = 'mode resize'
alt-shift-semicolon = 'mode service'

[mode.resize.binding]
h = 'resize width -50'
j = 'resize height +50'
k = 'resize height -50'
l = 'resize width +50'
left = 'resize width -50'
down = 'resize height +50'
up = 'resize height -50'
right = 'resize width +50'
enter = 'mode main'
esc = 'mode main'
alt-r = 'mode main'

# --- service mode -----------------------------------------------------------
# join-with is AeroSpace's equivalent of i3's mod+v / mod+h split: it decides
# which container a window joins rather than splitting one in place.
[mode.service.binding]
esc = ['reload-config', 'mode main']
r = ['flatten-workspace-tree', 'mode main']
f = ['layout floating tiling', 'mode main']
backspace = ['close-all-windows-but-current', 'mode main']
alt-shift-h = ['join-with left', 'mode main']
alt-shift-j = ['join-with down', 'mode main']
alt-shift-k = ['join-with up', 'mode main']
alt-shift-l = ['join-with right', 'mode main']
