onboarding = false
[ui]
agent_panel_sort = "spaces"

[keys]
# Direct cycling between spaces and agents.
previous_workspace = "ctrl+alt+h"
next_workspace = "ctrl+alt+l"
previous_agent = "ctrl+alt+k"
next_agent = "ctrl+alt+j"

# Lantern (aigora.lantern plugin). prefix+h is "focus pane left", so capital H.
[[keys.command]]
key = "prefix+H"
type = "plugin_action"
command = "aigora.lantern.open"
description = "Open lantern"
