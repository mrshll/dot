#!/bin/sh
# herdr rewrites this file itself: `onboarding` and the [ui] block are state it
# updates as you use the TUI, so a plain managed file drifted on every machine
# and made `chezmoi apply` stop on an interactive prompt. Only [keys] and below
# are managed here; everything above [keys] is carried through from whatever
# herdr last wrote.
set -eu

# stdin is the current target file, empty if it does not exist yet.
state=$(sed '/^\[keys\]/,$d')

if [ -z "$(printf '%s' "$state" | tr -d '[:space:]')" ]; then
    state='onboarding = false
[ui]
agent_panel_sort = "spaces"'
fi

printf '%s\n\n' "$state"

cat <<'TOML'
[keys]
# One rung of the keyboard ladder (see dot_config/aerospace/aerospace.toml).
# ctrl+alt is herdr's modifier, and it means the same thing here that alt
# means one layer up: hjkl focuses directionally, 1..9 selects a workspace.
# ctrl+alt is safe through the terminal and collides with nothing (Rectangle's
# Todo mode sits on ctrl+alt+b / ctrl+alt+n, which miss this set).
focus_pane_left = "ctrl+alt+h"
focus_pane_down = "ctrl+alt+j"
focus_pane_up = "ctrl+alt+k"
focus_pane_right = "ctrl+alt+l"
switch_workspace = "ctrl+alt+1..9"

# prefix+hjkl is freed up by the above (it defaulted to pane focus), so it
# takes over the *cycling* variants: h/l steps workspaces, j/k steps agents.
# This is the pre-ladder ctrl+alt+hjkl behaviour, moved one rung inward.
previous_workspace = "prefix+h"
next_workspace = "prefix+l"
previous_agent = "prefix+k"
next_agent = "prefix+j"

# Reserve prefix+Shift+R for the supervisor refresh action below.
reload_config = ""

# Everything else stays on the prefix (ctrl+b) defaults: splits, tabs,
# worktrees, detach. Note tmux also prefixes on ctrl+b — herdr consumes it as
# the outer app, and a nested tmux answers oh-my-tmux's prefix2 ctrl+a
# instead (~/.tmux.conf:27 binds C-a send-prefix -2).

# Slack-registered Herdr Meta supervisor. prefix+h now steps workspaces, so
# this stays on capital H.
[[keys.command]]
key = "prefix+H"
type = "plugin_action"
command = "mrshll.herdr-meta-slack.open-claude"
description = "Open Claude Slack supervisor"

[[keys.command]]
key = "prefix+R"
type = "plugin_action"
command = "mrshll.herdr-meta.refresh"
description = "Refresh supervisor with handoff"

# One row per agent. herdr-meta names the pane "◆ <name>" on the agents marsh
# talks to, which "Rename pane" in the UI also sets, and reports a `sub` token
# of "↳ <role> · <model>" on their helpers, so under the grouped sort the
# panel reads as a tree: pane names in white, helpers in the default colour,
# the kind dim after.
[ui.sidebar.agents]
rows = [[
  "state_icon",
  { token = "pane", fg = "#ffffff", dim = false },
  { token = "$sub", dim = false },
  { token = "agent", dim = true },
]]
TOML
